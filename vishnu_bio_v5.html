<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vishnulal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:   #0c0c0c;
    --text: #e4ddd4;
    --left-margin: clamp(72px, 16vw, 240px);
    --right-margin: clamp(72px, 16vw, 240px);
  }

  html { scroll-behavior: auto; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Funnel Display', sans-serif;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    overflow-x: hidden;
  }

  /* ── runway: purely scroll distance ── */
  #runway { /* height set by JS */ }

  /* ── fixed stage ── */
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 10;
  }

  /* ── text block: positioned absolutely, translateY drives centering ── */
  #text-block {
    position: absolute;
    left: var(--left-margin);
    right: var(--right-margin);
    top: 0;
    text-align: left;
    font-size: clamp(1.55rem, 3vw, 2.4rem);
    line-height: 1.8;
    /* translateY set by JS */
    will-change: transform;
  }

  /* ── word wrapper ── */
  .w {
    display: inline-flex;
    align-items: center;        /* vertically centers bg and inner together */
    position: relative;
    vertical-align: middle;     /* keeps inline-flex baseline-aligned with siblings */
  }

  /* the highlight bg lives behind the text */
  .w .bg {
    position: absolute;
    top: 50%;
    left: -5px;
    right: -5px;
    height: 1.15em;             /* matches cap height closely, not full line-height */
    transform: translateY(-50%) scaleX(0);
    transform-origin: left center;
    background: var(--text);
    border-radius: 3px;
    z-index: 0;
    pointer-events: none;
    transition: transform 0.14s cubic-bezier(0.22,1,0.36,1),
                opacity   0.12s ease;
    opacity: 0;
  }

  /* text sits above bg */
  .w .inner {
    position: relative;
    z-index: 1;
    display: inline-block;
    opacity: 0;
    white-space: pre;
    will-change: opacity;
    transition: opacity 0.28s ease, color 0.1s ease;
  }

  /* active word: bg visible, text inverted */
  .w.active .bg {
    transform: translateY(-50%) scaleX(1);
    opacity: 1;
  }
  .w.active .inner {
    color: var(--bg);
    opacity: 1 !important;
  }

  /* paragraph gap */
  .para-gap {
    display: block;
    height: 1.1em;
  }

  /* scroll hint */
  #scroll-hint {
    position: fixed;
    bottom: 2rem;
    left: var(--left-margin);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.55rem;
    z-index: 50;
    opacity: 1;
    transition: opacity 0.5s;
  }
  #scroll-hint.gone { opacity: 0; pointer-events: none; }
  #scroll-hint p {
    font-size: 0.58rem;
    letter-spacing: 0.28em;
    color: rgba(228,221,212,0.22);
    font-family: 'Funnel Display', sans-serif;
    font-weight: 500;
    text-transform: uppercase;
  }
  #scroll-hint .bar {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, transparent, rgba(228,221,212,0.18));
  }

  /* grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 400;
    opacity: 0.6;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="text-block"></div>
</div>

<div id="runway"></div>

<div id="scroll-hint">
  <p>scroll</p>
  <div class="bar"></div>
</div>

<script>
gsap.registerPlugin(ScrollTrigger);

/* ─────────────────────────────────────
   CONTENT
───────────────────────────────────── */
const paragraphs = [
  ["I'm","Vishnulal.","A","designer","who","starts","with","how","something","looks","and","works","backwards","from","there.","Aesthetics","first,","everything","else","gets","figured","out","around","that."],
  ["I've","spent","12","years","at","the","intersection","of","motion,","brand,","and","product.","Which","is","a","polished","way","of","saying","I've","been","in","a","lot","of","rooms","insisting","that","how","something","looks","is","not","the","last","conversation,","it's","the","first","one."],
  ["Most","of","my","career","has","lived","in","the","detailed","middle:","between","a","brand","film","and","a","UI","system,","between","a","3D","render","and","an","interaction","state,","between","what","looks","exactly","right","and","what","actually","ships.","At","scale,","too.","Ola","Electric","—","visual","language","for","India's","EV","era,","built","from","nothing.","MoveOS","—","900,000+","users.","Kruti.AI","—","one","shot","to","introduce","an","AI","to","the","world."],
  ["Different","mediums.","Same","underlying","question:","does","this","look","exactly","right?"],
  ["These","days","I'm","interested","in","work","that","uses","all","of","it.","Motion,","product,","generative","art,","interactive","experience.","Work","where","the","visual","decision","has","real","weight,","and","where","someone","notices","when","you","get","it","wrong."],
  ["Looking","for","the","right","creative","challenge.","One","where","aesthetics","are","taken","seriously","from","day","one.","I","work","best","with","loud","music","and","good","collaborators,","both","are","non-negotiable."]
];

/* ─────────────────────────────────────
   BUILD DOM
───────────────────────────────────── */
const block  = document.getElementById('text-block');
const runway = document.getElementById('runway');
const hint   = document.getElementById('scroll-hint');

// flat list of { wrapperEl, innerEl }
const words = [];

paragraphs.forEach((para, pi) => {
  para.forEach(word => {
    const wrapper = document.createElement('span');
    wrapper.className = 'w';

    const bg = document.createElement('span');
    bg.className = 'bg';

    const inner = document.createElement('span');
    inner.className = 'inner';
    inner.textContent = word + '\u00A0';

    wrapper.appendChild(bg);
    wrapper.appendChild(inner);
    block.appendChild(wrapper);
    words.push({ wrapper, inner });
  });

  if (pi < paragraphs.length - 1) {
    const gap = document.createElement('span');
    gap.className = 'para-gap';
    block.appendChild(gap);
  }
});

const total       = words.length;
const PX_PER_WORD = 68;
const GHOST       = 9;

runway.style.height = (window.innerHeight + total * PX_PER_WORD) + 'px';

/* ─────────────────────────────────────
   CENTERING
   We track the top of the current word
   and shift the block so that word sits
   at 50vh.
───────────────────────────────────── */
function getWordTop(index) {
  const el = words[index].inner;
  // offsetTop relative to #text-block
  let top = 0;
  let node = el;
  while (node && node !== block) {
    top += node.offsetTop;
    node = node.offsetParent;
  }
  return top;
}

function centerOnWord(index) {
  const clamp = Math.min(index, total - 1);
  // We want: block.top + wordTop = 50vh
  // block is position:absolute, top=0 normally
  // So: translateY = 50vh - wordTop
  const wordTop    = getWordTop(clamp);
  const lineHeight = words[clamp].inner.offsetHeight;
  const target     = window.innerHeight / 2 - wordTop - lineHeight / 2;
  gsap.set(block, { y: target });
}

/* ─────────────────────────────────────
   WORD STATE UPDATER
───────────────────────────────────── */
let lastHead = -2;

function updateWords(progress) {
  const head = Math.min(Math.floor(progress * total), total - 1);
  if (head === lastHead) return;
  lastHead = head;

  words.forEach(({ wrapper, inner }, i) => {
    wrapper.classList.remove('active');

    if (i < head) {
      inner.style.opacity = '1';
      inner.style.color   = '';
    } else if (i === head) {
      // current word — gets highlight
      inner.style.opacity = '1';
      inner.style.color   = '';
      wrapper.classList.add('active');
    } else if (i <= head + GHOST) {
      const dist    = i - head;
      const opacity = 0.14 * (1 - dist / (GHOST + 1));
      inner.style.opacity = String(Math.max(0.03, opacity));
      inner.style.color   = '';
    } else {
      inner.style.opacity = '0';
      inner.style.color   = '';
    }
  });

  // re-center on current word after layout settles
  requestAnimationFrame(() => centerOnWord(head));
}

/* ─────────────────────────────────────
   SCROLL TRIGGER
───────────────────────────────────── */
ScrollTrigger.create({
  trigger: runway,
  start: 'top top',
  end: 'bottom bottom',
  scrub: 0.45,
  onUpdate(self) {
    updateWords(self.progress);
    if (self.progress > 0.01) hint.classList.add('gone');
    else hint.classList.remove('gone');
  }
});

window.addEventListener('resize', () => {
  centerOnWord(lastHead < 0 ? 0 : lastHead);
});

/* ─────────────────────────────────────
   INIT
───────────────────────────────────── */
window.addEventListener('load', () => {
  updateWords(0);
  gsap.from('#stage', { opacity: 0, duration: 1.4, ease: 'power2.out' });
});
</script>
</body>
</html>
